id: compression-prefix-probe
version: 2
schema_version: 2
category: instrumentation
classification:
  - instrumentation
tier: 1
title: Wire-prefix hash probe (external wrap, no Hermes core edits)
known_bad: null
known_good: null
honesty:
  production_replay: false
  note: "Hashes outgoing request payloads. Does not claim provider cache hits without cache_read_tokens."
task:
  sequence:
    - accumulate one session T1-T4 (same system/tools, suffix growth)
    - T5 force compress()
expect:
  hashes_only: true
  accumulating_history: true
  report_per_turn:
    - turn
    - system_hash
    - tools_hash
    - message_count
    - shared_prefix_count
    - prefix_retention_ratio
    - compression_event
    - first_divergence
